name: Build PR

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_OPTS: -Xmx6g -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false 
    -Dmaven.wagon.http.retryhandler.count=5 
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

# Cancel running jobs when a new push happens to the same branch as otherwise it will
# tie up too many resources without providing much value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pr:
    runs-on: ubuntu-22.04
    steps:
      # Pinned to v5.1.0
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # Pinned to v5.7.0
    - name: Set up JDK 11
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: 'zulu'
        java-version: '11'

      # Cache .m2/repository
      # Pinned to v5.1.0
    - name: Cache local Maven repository
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      continue-on-error: true
      with:
        path: ~/.m2/repository
        key: cache-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          cache-maven-${{ hashFiles('**/pom.xml') }}
          cache-maven-

    - name: Verify with Maven
      run: ./mvnw -B -ntp --file pom.xml verify -DskipTests=true 
        -DskipH3Spec=true

    - name: print JVM thread dumps when cancelled
      uses: ./.github/actions/thread-dump-jvms
      if: ${{ cancelled() }}

  build-pr-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 11
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-11-arm64
    runs-on: ${{ matrix.runner }}
    name: windows-x86_64-java11-boringssl [${{ matrix.expander_leg }}]
    needs: verify-pr
    env:
      # Let's limit the amount of ram that is used to unpack rustup as we saw
      # failures sometimes due the fact that not enough memory could be reserved.
      RUSTUP_UNPACK_RAM: 134217728  # Use 128 MiB
    steps:
      # Pinned to v5.1.0
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Pinned to v5.7.0
    - name: Set up JDK 11
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: 'zulu'
        java-version: '${{ matrix.java }}'

    - name: Install stable rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

      # Pinned to v3.0.0
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57

      # Pinned to v1.13.0
    - name: Configuring Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: x86_amd64

      # Pinned to v4.1.0
    - name: Install tools
      uses: 
        crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac
      with:
        args: install ninja nasm

      # Cache .m2/repository
      # Pinned to v5.1.0
    - name: Cache local Maven repository
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      continue-on-error: true
      with:
        path: ~/.m2/repository
        key: cache-windows-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          cache-windows-maven-${{ hashFiles('**/pom.xml') }}
          cache-windows-maven-

    - name: Set up TestLens
      uses: testlens-app/setup-testlens@d29a2be31512b3aeda3adcef09fbe0d55af90c51   # Pin 1.9.4

    - name: Build project
      run: ./mvnw.cmd -B -ntp --file pom.xml clean package -Pboringssl 
        -DskipHttp2Testsuite=true -DskipAutobahnTestsuite=true

    - name: print JVM thread dumps when cancelled
      uses: ./.github/actions/thread-dump-jvms
      if: ${{ cancelled() }}

      # Pinned to v6.0.0
    - name: Upload Test Results
      if: ${{ always() }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: test-results-windows-x86_64-java11-boringssl
        path: '**/target/surefire-reports/TEST-*.xml'

      # Pinned to v6.0.0
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: ${{ failure() || cancelled() }}
      with:
        name: build-pr-windows-target
        path: |
          **/target/surefire-reports/
          **/hs_err*.log

    timeout-minutes: 150
